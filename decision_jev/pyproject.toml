[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-jev"
version = "0.1.0"
description = "Terminal-feature-conditioned discrete whole-action robot policy"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev = "jev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
